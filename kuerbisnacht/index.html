<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Kürbisnacht auf Burg Mondstein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Creepster&family=Lilita+One&display=swap">
<style>
/* Ein Bildschirm: die 3D-Bühne füllt alles, Anzeigen und Werkzeugleisten schweben darüber.
   Bewusst nur ein Look: Halloween-Nacht in der Burg (dunkles Pflaumenlila, Kürbisorange, Kerzengelb). */
:root {
  --night: #120c22;
  --plum: rgba(28, 17, 50, .88);
  --plum-solid: #22153d;
  --line: rgba(255, 158, 64, .42);
  --pumpkin: #ff8a1f;
  --pumpkin-deep: #b85406;
  --candle: #ffd36b;
  --slime: #a8e86a;
  --witch: #b18cff;
  --bone: #fff3df;
  --muted: #cfbde8;
  --ink: #2a160a;
  --logo: "Creepster", "Lilita One", Impact, sans-serif;
  --head: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--bone); font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font-family: inherit; }
#vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(120, 60, 200, .55) 100%); transition: opacity .4s; }

/* ---------- Kopfleiste ---------- */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + var(--safe-t)) 14px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; }
.chip { background: var(--plum); border: 2px solid var(--line); border-radius: 999px; padding: 5px 14px; display: flex; align-items: center; gap: 7px; font-family: var(--head); font-size: 17px; box-shadow: 0 6px 18px rgba(0,0,0,.35); white-space: nowrap; }
.chip svg { width: 24px; height: 24px; flex: none; }
#score b { color: var(--candle); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
#score span { font-size: 14px; color: var(--muted); }
#score.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
#pill { font-size: 15px; justify-content: center; text-align: center; white-space: normal; text-wrap: balance; }
#pill em { font-style: normal; color: var(--pumpkin); }
.roundBtn { pointer-events: auto; width: 46px; height: 46px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: var(--plum); color: var(--bone); display: grid; place-items: center; cursor: pointer; padding: 0; }
.roundBtn svg { width: 24px; height: 24px; }
.roundBtn:focus-visible, .btn:focus-visible, .tool:focus-visible, .sw:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 3px solid var(--candle); outline-offset: 3px; }
#timer { position: fixed; z-index: 5; top: calc(62px + var(--safe-t)); left: 50%; transform: translateX(-50%); font-size: 20px; pointer-events: none; }
#timer b { font-weight: 400; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
#timer.warn { border-color: #ff6b6b; color: #ffd7d7; animation: pulse .9s infinite; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.1); } }
#hint { position: fixed; z-index: 4; left: 14px; top: calc(62px + var(--safe-t)); max-width: min(300px, 44%); font-size: 14px; line-height: 1.3; color: var(--bone); background: rgba(18, 12, 34, .7); border-radius: 12px; padding: 7px 11px; pointer-events: none; }
.topbar { position: fixed; z-index: 5; top: calc(110px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: max-content; max-width: calc(100% - 24px); pointer-events: none; }
.topbar .chip { font-family: var(--body); font-weight: 700; font-size: 14px; padding: 4px 11px; }
.topbar .chip.done { border-color: var(--slime); color: var(--slime); }
.topbar .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.topbar .chip b { font-family: var(--head); font-weight: 400; font-size: 16px; color: var(--candle); }

/* ---------- Meldungen ---------- */
#toast { position: fixed; z-index: 12; left: 50%; top: calc(150px + var(--safe-t)); transform: translate(-50%, -10px); width: max-content; max-width: calc(100% - 32px); background: var(--bone); color: var(--ink); border: 3px solid var(--pumpkin); border-radius: 16px; padding: 7px 16px; font-weight: 800; font-size: 17px; text-align: center; box-shadow: 0 10px 26px rgba(0,0,0,.45); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#card { position: fixed; z-index: 11; left: 50%; top: 30%; transform: translate(-50%, 14px); width: min(460px, calc(100% - 32px)); text-align: center; background: var(--plum-solid); border: 3px solid var(--pumpkin); border-radius: 22px; padding: 16px 20px 18px; box-shadow: 0 0 0 6px rgba(255,138,31,.15), 0 18px 44px rgba(0,0,0,.55); opacity: 0; transition: opacity .45s, transform .45s; pointer-events: none; }
#card.on { opacity: 1; transform: translate(-50%, 0); }
.kick { display: block; font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--pumpkin); }
#card h2, .panel h2 { margin: 4px 0 6px; font-family: var(--head); font-weight: 400; font-size: clamp(26px, 6.5vw, 36px); line-height: 1.05; color: var(--bone); text-wrap: balance; }
#card p { margin: 0; font-size: 16px; line-height: 1.35; color: var(--muted); }
#floats { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, -50%); font-family: var(--head); font-size: 24px; color: var(--candle); text-shadow: 0 2px 0 #3a1500, 0 0 12px rgba(0,0,0,.7); white-space: nowrap; animation: floatUp 1.2s ease-out forwards; }
.float.bad { color: #ff9a9a; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
#joy { position: fixed; z-index: 7; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; border: 3px solid rgba(255, 190, 120, .6); background: rgba(255, 160, 60, .12); display: grid; place-items: center; pointer-events: none; }
#joyKnob { width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 214, 160, .9); box-shadow: 0 0 18px rgba(255, 160, 60, .8); }
#fade { position: fixed; inset: 0; z-index: 30; background: #07040e; opacity: 1; transition: opacity .45s; pointer-events: none; }
#fade.off { opacity: 0; }

/* ---------- Tafeln & Knöpfe ---------- */
.panel { background: var(--plum); border: 2px solid var(--line); border-radius: 24px; padding: 18px 20px 20px; box-shadow: 0 0 0 5px rgba(255,138,31,.08), 0 20px 50px rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; background: rgba(8, 4, 18, .5); }
.overlay .panel { width: min(470px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; text-align: center; }
.panel p { margin: 0; font-size: 17px; line-height: 1.4; }
.btn { font-family: var(--head); font-size: 22px; border: 0; border-radius: 999px; padding: 10px 28px; cursor: pointer; color: var(--ink); background: var(--pumpkin); box-shadow: 0 5px 0 var(--pumpkin-deep), 0 10px 22px rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; justify-self: center; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--pumpkin-deep); }
.btn.big { font-size: 26px; padding: 12px 34px; }
.btn.ghost { background: transparent; color: var(--bone); border: 2px solid var(--line); box-shadow: none; font-size: 17px; padding: 8px 18px; }
.btn.small { font-size: 16px; padding: 7px 16px; }
.tiny { font-size: 13px; color: var(--muted); line-height: 1.3; }

/* ---------- Titelbild ---------- */
#title { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; padding-inline: 16px; padding-block: 16px; pointer-events: none; }
#title .panel { pointer-events: auto; width: min(430px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; margin-left: clamp(0px, 4vw, 60px); }
.logo { margin: 0; font-family: var(--logo); font-weight: 400; font-size: clamp(46px, 11vw, 70px); line-height: .9; color: var(--pumpkin); text-shadow: 0 4px 0 #5a2200, 0 0 26px rgba(255,138,31,.55); letter-spacing: .03em; }
.sub { margin: -4px 0 4px; font-family: var(--head); font-size: 21px; color: var(--slime); letter-spacing: .04em; }
.lbl { font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
#nameIn { font: 700 20px var(--body); color: var(--bone); background: rgba(255,255,255,.07); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
#nameIn::placeholder { color: rgba(207,189,232,.6); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
.sw.on { border-color: var(--candle); box-shadow: 0 0 0 3px rgba(255, 211, 107, .35); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; font: 700 15px var(--body); color: var(--bone); background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.15); border-radius: 12px; padding: 6px 10px; cursor: pointer; }
.seg button.on { border-color: var(--pumpkin); background: rgba(255,138,31,.25); }
#startBtn { margin-top: 6px; }
.records { display: grid; gap: 6px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 10px; margin-top: 4px; }
#bestLine { font-family: var(--head); font-size: 17px; }
#bestLine b { color: var(--candle); font-weight: 400; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); cursor: help; }
.badge.lock { filter: grayscale(1) brightness(.45); }
.badge.got { border-color: var(--candle); background: rgba(255, 211, 107, .16); }
@media (max-aspect-ratio: 4/5) {
  #title { align-items: flex-end; }
  #title .panel { margin-left: 0; max-height: 64%; gap: 7px; padding: 14px 16px 16px; }
  .logo { font-size: 50px; }
  .sub { font-size: 18px; }
}

/* ---------- Werkzeugleisten ---------- */
.dock { position: fixed; z-index: 6; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 20px); box-sizing: border-box; background: var(--plum); border: 2px solid var(--line); border-radius: 20px; padding: 8px; display: grid; gap: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.dock .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; }
.tool { flex: none; width: 56px; min-height: 56px; border-radius: 14px; border: 2px solid rgba(255,243,223,.16); background: rgba(255,255,255,.06); color: var(--bone); display: grid; place-items: center; align-content: center; gap: 1px; padding: 3px 2px; font: 700 11px/1.05 var(--body); cursor: pointer; }
.tool canvas, .tool svg { width: 30px; height: 30px; display: block; }
.tool .emo { font-size: 26px; line-height: 30px; }
.tool.on { border-color: var(--pumpkin); background: rgba(255,138,31,.24); box-shadow: inset 0 0 0 2px rgba(255,138,31,.3); }
.tool.go { width: 78px; background: var(--pumpkin); color: var(--ink); border-color: #ffd0a0; font-family: var(--head); font-size: 17px; font-weight: 400; }
.tool:disabled { opacity: .4; }
.sizes { display: flex; gap: 4px; }
.sizes button { width: 40px; height: 56px; border-radius: 12px; border: 2px solid rgba(255,243,223,.16); background: rgba(255,255,255,.06); color: var(--bone); cursor: pointer; display: grid; place-items: center; padding: 0; }
.sizes button i { display: block; border-radius: 50%; background: currentColor; }
.sizes button.on { border-color: var(--pumpkin); background: rgba(255,138,31,.24); }
.sw.frost { width: 44px; height: 44px; }
.divider { width: 2px; align-self: stretch; background: rgba(255,255,255,.12); border-radius: 2px; }
@media (max-width: 520px) { .tool { width: 50px; min-height: 52px; font-size: 10px; } .tool canvas, .tool svg { width: 26px; height: 26px; } .tool .emo { font-size: 22px; line-height: 26px; } .tool.go { width: 66px; font-size: 15px; } .sizes button { width: 34px; height: 52px; } .sw.frost { width: 38px; height: 38px; } }

/* ---------- Jury ---------- */
#jury { position: fixed; z-index: 8; left: 50%; bottom: calc(12px + var(--safe-b)); transform: translateX(-50%); width: min(700px, calc(100% - 20px)); box-sizing: border-box; display: grid; gap: 10px; padding: 14px; }
#juryWho { margin: 0; font-family: var(--head); font-weight: 400; font-size: 24px; text-align: center; }
.judges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.judge { background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.1); border-radius: 14px; padding: 8px 6px; text-align: center; min-width: 0; display: grid; gap: 2px; align-content: start; }
.judge .who { font-weight: 800; font-size: 13px; color: var(--muted); }
.judge .num { font-family: var(--head); font-size: 42px; line-height: 1; color: var(--candle); }
.judge .num.flip { animation: flip .5s ease; }
@keyframes flip { 0% { transform: rotateX(90deg) scale(.6); } 60% { transform: rotateX(-10deg) scale(1.2); } 100% { transform: none; } }
.judge .say { font-size: 13px; line-height: 1.25; min-height: 2.6em; }
#juryTotal { text-align: center; font-family: var(--head); font-size: 21px; min-height: 1.2em; }
#juryTotal b { color: var(--candle); font-weight: 400; }
#skipBtn { position: fixed; z-index: 8; right: 14px; top: calc(64px + var(--safe-t)); }
.podlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; }
.podlist li { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06); border-radius: 14px; padding: 7px 12px; font-size: 18px; font-weight: 700; }
.podlist li.me { border: 2px solid var(--pumpkin); background: rgba(255,138,31,.16); }
.podlist .medal { font-size: 26px; width: 32px; text-align: center; flex: none; }
.podlist .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.podlist .pt { font-family: var(--head); font-weight: 400; color: var(--candle); font-variant-numeric: tabular-nums; }

/* ---------- Ergebnis ---------- */
#results { position: fixed; z-index: 10; right: clamp(12px, 4vw, 60px); top: 50%; transform: translateY(-50%); width: min(400px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; box-sizing: border-box; display: grid; gap: 10px; text-align: center; }
#rankTitle { margin: 0; font-family: var(--logo); font-weight: 400; font-size: clamp(38px, 9vw, 52px); line-height: .95; color: var(--pumpkin); text-shadow: 0 3px 0 #5a2200, 0 0 20px rgba(255,138,31,.5); }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; text-align: left; }
.lines li { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,.05); }
.lines li span:last-child { font-family: var(--head); font-weight: 400; color: var(--candle); font-variant-numeric: tabular-nums; white-space: nowrap; }
#totalLine { font-family: var(--head); font-size: 28px; }
#totalLine b { color: var(--candle); font-weight: 400; }
#recordLine { font-weight: 800; color: var(--slime); min-height: 1.2em; }
.btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
@media (max-aspect-ratio: 4/5) { #results { top: auto; bottom: calc(10px + var(--safe-b)); right: 50%; transform: translateX(50%); max-height: 60%; } }
.rotate { display: none; margin: 0; font-size: 13px; font-weight: 700; color: var(--slime); text-align: center; }
@media (max-width: 600px) and (orientation: portrait) { .rotate { display: block; } }
@media (max-height: 520px) and (orientation: landscape) {
  #title { align-items: center; }
  #title .panel { gap: 5px; padding: 12px 16px; max-height: 100%; }
  .logo { font-size: 40px; } .sub { font-size: 15px; margin: -2px 0 0; }
  .lbl { font-size: 11px; margin-top: 0; } #nameIn { padding: 5px 12px; font-size: 17px; }
  .sw { width: 30px; height: 30px; } .seg button { padding: 4px 8px; font-size: 14px; }
  #startBtn { font-size: 22px; padding: 8px 28px; margin-top: 2px; }
  .records { display: none; }
  #hint { display: none !important; }
  #timer { top: calc(10px + var(--safe-t)); left: auto; right: 70px; transform: none; font-size: 16px; animation: none !important; }
  .topbar { top: calc(90px + var(--safe-t)); }
  #toast { top: calc(100px + var(--safe-t)); font-size: 15px; }
  .dock { padding: 5px; gap: 4px; }
  .dock .row { flex-wrap: nowrap; overflow-x: auto; justify-content: safe center; max-width: calc(100vw - 40px); }
  .tool { width: 46px; min-height: 46px; font-size: 9px; } .tool canvas, .tool svg { width: 22px; height: 22px; } .tool .emo { font-size: 20px; line-height: 22px; }
  .tool.go { width: 64px; font-size: 14px; } .sizes button { width: 32px; height: 46px; } .sw.frost { width: 32px; height: 32px; }
  #card { top: 16%; padding: 10px 16px; } #card h2 { font-size: 24px; } #card p { font-size: 14px; }
  #jury { padding: 8px; gap: 6px; } #juryWho { font-size: 19px; } .judge .num { font-size: 30px; } .judge .say { font-size: 11px; min-height: 2.2em; }
  .overlay .panel { padding: 12px 16px; gap: 8px; } .panel h2 { font-size: 24px; } .podlist li { padding: 4px 10px; font-size: 15px; } .btn.big { font-size: 21px; padding: 8px 26px; }
  #results { width: min(360px, 48%); max-height: calc(100% - 20px); gap: 6px; } #rankTitle { font-size: 34px; } .lines li { font-size: 14px; padding: 2px 8px; }
}
@media (prefers-reduced-motion: reduce) { #toast, #card, #fade, .btn { transition: none; } .float, #score.bump, #timer.warn, .judge .num.flip { animation: none; } }
.home { color: var(--muted); font-weight: 700; font-size: 15px; text-decoration: none; justify-self: center; }
.home:hover, .home:focus-visible { color: var(--bone); text-decoration: underline; }
</style>
</head>
<body>

<canvas id="c" tabindex="-1" aria-label="Kürbisnacht auf Burg Mondstein"></canvas>
<div id="vignette"></div>

<header class="hud">
  <div id="score" class="chip" hidden><svg viewBox="0 0 24 24"><path fill="#ff8a1f" stroke="#3a1500" stroke-width="1.4" d="M12 6.5c-2-1.2-6.4-.6-7.9 3.1-1.4 3.6.3 8.9 4 9.7 1.4.3 2.6-.2 3.9-.2s2.5.5 3.9.2c3.7-.8 5.4-6.1 4-9.7C18.4 5.9 14 5.3 12 6.5z"/><path fill="#6e8f2c" d="M11.2 6.6c0-1.9.5-3.4 1.9-4.4l1 1c-1 .7-1.4 1.9-1.4 3.4z"/><path fill="#3a1500" d="M8 11l1.6-1.8L11 11zM13 11l1.4-1.8L16 11zM8.4 14.2c2.4 1.6 4.8 1.6 7.2 0-.4 2-1.9 3-3.6 3s-3.2-1-3.6-3z"/></svg><b>0</b><span>Punkte</span></div>
  <div id="pill" class="chip" hidden></div>
  <button id="soundBtn" class="roundBtn" aria-label="Ton an oder aus"></button>
</header>
<div id="timer" class="chip" hidden><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12M6 21h12M7 3c0 5 4 6 5 9-1 3-5 4-5 9M17 3c0 5-4 6-5 9 1 3 5 4 5 9"/><path fill="#ffd36b" d="M8.8 19c1.1-1.7 2.1-2.4 3.2-3.3 1.1.9 2.1 1.6 3.2 3.3z"/></svg><b>60</b></div>
<div id="hint" hidden></div>
<div id="toast" role="status"></div>
<div id="card"><small id="cardKick" class="kick"></small><h2 id="cardTitle"></h2><p id="cardText"></p></div>
<div id="floats"></div>
<div id="joy" hidden><div id="joyKnob"></div></div>

<section id="title" hidden>
  <div class="panel">
    <h1 class="logo">Kürbisnacht</h1>
    <p class="sub">auf Burg Mondstein</p>
    <label class="lbl" for="nameIn">Wie heißt deine Ritterin?</label>
    <input id="nameIn" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Dein Name">
    <div class="lbl">Haare</div><div class="swatches" id="hairSw"></div>
    <div class="lbl">Haut</div><div class="swatches" id="skinSw"></div>

const JUDGE_SAYS = [
  { hi: ['Wie königlich! Schön gleichmäßig.', 'Bravo! Das gefällt der Königin.', 'Prachtvoll, meine Liebe!'], mid: ['Recht hübsch, meine Liebe.', 'Ordentlich geschnitzt.', 'Gar nicht übel.'], lo: ['Hm, ein bisschen schief, oder?', 'Da fehlt noch etwas Glanz.', 'Die Königin ist nicht überzeugt.'] },
  { hi: ['Zum Anbeißen süß!', 'Da geht mir das Herz auf!', 'So ein liebes Gesicht!'], mid: ['Hübsch, hübsch, Schätzchen!', 'Schön, aber noch mehr Liebe!', 'Fast so gut wie meine Torte.'], lo: ['Da fehlt die Prise Liebe.', 'Eher ein trauriger Kürbis.', 'Mehr Herz, bitte!'] },
  { hi: ['Miau! Sooo gruselig!', 'Miau! Mein Fell sträubt sich!', 'Miau! Da krieg ich Gänsehaut!'], mid: ['Miau. Ein bisschen gruselig.', 'Miau, ganz nett.', 'Miau? Ich kenne Gruseligeres.'], lo: ['Miau ... gähn.', 'Miau. Da schlaf ich ja ein.', 'Miau! Viel zu brav!'] },
];
const EMPTY_SAYS = ['Wo ist denn das Gesicht?', 'Der Kürbis ist ja noch ganz glatt!', 'Miau? Da ist ja gar nichts!'];
function judgeFace(m, skill = 1) {
  if (!m.acts || m.frac < .004) return { scores: [1, 1, 1], says: EMPTY_SAYS.slice() };
  const cutS = m.frac < .04 ? m.frac / .04 : m.frac <= .3 ? 1 : Math.max(0, 1 - (m.frac - .3) / .3);
  const compS = m.comps === 0 ? 0 : m.comps === 1 ? .4 : m.comps === 2 ? .65 : m.comps <= 10 ? 1 : Math.max(.5, 1 - (m.comps - 10) / 20);
  const faceS = (m.upper >= 2 ? .5 : m.upper === 1 ? .3 : 0) + (m.lower >= 1 ? .5 : 0);
  const Q = .25 * cutS + .2 * compS + .35 * faceS + .2 * Math.min(1, m.acts / 5);
  const cute = m.cute + m.knife * .5, scary = m.scary + m.knife * .5;
  const v = [.55 * Q + .45 * m.sym, .65 * Q + .35 * Math.min(1, cute / 3) + (m.variety >= 3 ? .08 : 0), .65 * Q + .35 * Math.min(1, scary / 3) + (m.frac > .14 ? .08 : 0)];
  const scores = v.map(x => clamp(Math.round(2 + 8 * Math.min(1, x) * skill + rand(-.6, .6)), 1, 10));
  return { scores, says: scores.map((s, j) => pick(JUDGE_SAYS[j][s >= 8 ? 'hi' : s >= 5 ? 'mid' : 'lo'])) };
}

    if (Game.quick) { const first = Game.hunt && Game.hunt.place === 0; title = first ? 'Geisterflüsterin' : 'Geisterjägerin'; text = first ? 'Gustav hat sich nirgends sicher versteckt gefühlt!' : 'Fast! Beim nächsten Mal findest du Gustav als Erste.'; }
    else if (total >= 850) { title = 'Kürbiskönigin'; text = 'Die beste Halloween-Ritterin, die Burg Mondstein je gesehen hat!'; }
    else if (total >= 650) { title = 'Halloween-Heldin'; text = 'Schnitzen, backen, schmücken, suchen: Du kannst einfach alles.'; }
    else if (total >= 450) { title = 'Gruselprofi'; text = 'Ein richtig starkes Fest! Schaffst du die Kürbiskönigin?'; }
    else if (total >= 250) { title = 'Gespensterfreundin'; text = 'Gustav mag dich! Mit mehr Punkten wirst du Gruselprofi.'; }
    else { title = 'Kürbis-Lehrling'; text = 'Ein guter Anfang. Beim nächsten Mal holst du mehr Punkte!'; }
    $('rankTitle').textContent = title; $('rankText').textContent = text;
    $('totalLine').replaceChildren(document.createTextNode('Zusammen: '), el('b', null, `${total} Punkte`));
    const old = Save.data.best || 0;
    if (!Game.quick) Save.data.done = true;
    if (total > old) { Save.data.best = total; $('recordLine').textContent = old ? `Neuer Rekord! Vorher: ${old}` : 'Dein erster Rekord!'; } else $('recordLine').textContent = `Rekord: ${old} Punkte`;
    Save.store();
    const nb = $('newBadges'); nb.replaceChildren();
    Game.newBadges.forEach(id => { const b = BADGES.find(x => x.id === id), d = el('div', 'badge got', b.icon); d.title = b.name; nb.appendChild(d); });
    if (Game.newBadges.length) nb.prepend(el('span', 'tiny', 'Neue Abzeichen: '));
    $('results').hidden = false; Snd.fx.fanfare(); setTimeout(() => Snd.fx.applause(2.4), 600);
  },
};
defStage('finale', FinaleStage);
$('againBtn').addEventListener('click', () => { Snd.fx.click(); const q = Game.quick; Game.reset(); Game.quick = q; Game.face = null; goStage(q ? 'hunt' : 'carve'); });
$('homeBtn').addEventListener('click', () => { Snd.fx.click(); goStage('title'); });

/* ---------- Start ---------- */
(function boot() {
  Save.load();
  if (Save.data.player) Object.assign(Game.player, Save.data.player);
  Game.player.hair = clamp(Game.player.hair | 0, 0, 3); Game.player.skin = clamp(Game.player.skin | 0, 0, 3); Game.player.style = clamp(Game.player.style | 0, 0, 3);
  Game.faceOps = Array.isArray(Save.data.faceOps) ? Save.data.faceOps : [];
  Snd.on = Save.data.sound !== false; $('soundBtn').innerHTML = Snd.on ? SPEAKER_ON : SPEAKER_OFF;
  $('soundBtn').addEventListener('click', () => { Snd.init(); Snd.setOn(!Snd.on); });
  sizeRenderer(); requestAnimationFrame(frame);
  goStage('title');
})();

</script>
