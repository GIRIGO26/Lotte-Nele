/* =========================================================
   Einhörner gegen Dinos – das Aussehen
   ========================================================= */
:root{
  color-scheme:light;
  --ink:#2c1b47; --paper:#fff8ea; --paper2:#ffecc9; --sun:#ffd24d; --sun2:#f2a81d; --pink:#ff6fae; --mint:#3fd0b0; --sky:#57c8ff; --red:#ff5a4d; --green:#46e08a;
  --bg1:#42307a; --bg2:#231745; --bl:#fdf1d3; --bd:#b49cf0; --rim:#6a48c9; --rim-hi:#8f70e6; --rim-lo:#4f3399; --rim-dk:#33206b;
  --g1:#ff5fa2; --g2:#ffd24d;
  --fd:'DynaPuff','Trebuchet MS','Segoe UI',sans-serif; --fb:'Andika','Trebuchet MS',Verdana,sans-serif;
  --kontur:0 .07em 0 var(--ink),.07em 0 0 var(--ink),-.07em 0 0 var(--ink),0 -.07em 0 var(--ink),.05em .05em 0 var(--ink),-.05em .05em 0 var(--ink),.05em -.05em 0 var(--ink),-.05em -.05em 0 var(--ink),0 .16em 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:#fff;font-family:var(--fb);font-size:18px;line-height:1.35;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;margin:0}
h1,h2,h3,p{margin:0}
svg.art{display:block;width:100%;height:100%;overflow:visible}
.defs{position:absolute;width:0;height:0;overflow:hidden}

.app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(130% 95% at 50% 0%,var(--bg1),var(--bg2) 78%);transition:background .6s}
.app::before{content:"";position:absolute;left:-20%;top:-30%;width:140%;height:160%;pointer-events:none;
  background:radial-gradient(38% 30% at 22% 30%,var(--aura1,rgba(255,111,174,.26)),rgba(0,0,0,0) 70%),radial-gradient(34% 28% at 80% 64%,var(--aura2,rgba(88,201,245,.22)),rgba(0,0,0,0) 70%),radial-gradient(30% 26% at 56% 10%,var(--aura3,rgba(255,210,77,.15)),rgba(0,0,0,0) 70%);
  animation:aura 18s ease-in-out infinite alternate}
@keyframes aura{from{transform:translate(-3%,-2%) rotate(-4deg) scale(1)}to{transform:translate(3%,3%) rotate(5deg) scale(1.12)}}
.himmel{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
.himmel i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--c,#fff);opacity:0;animation:funkeln var(--t) ease-in-out var(--d) infinite}
@keyframes funkeln{0%,100%{opacity:0;transform:translate(0,0) scale(.6)}50%{opacity:var(--o,.7);transform:translate(var(--dx,0),var(--dy,-14px)) scale(1)}}
.screen{position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);display:none}
.screen.on{display:grid}

/* ---------- Knöpfe und Karten ---------- */
.btn{font:700 1.08rem/1.05 var(--fd);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:.62em .9em;min-height:52px;
  box-shadow:0 5px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:.5em;cursor:pointer;text-align:center;transition:transform .06s,box-shadow .06s,filter .15s}
.btn:active,.btn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible,.opt:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn svg{width:1.35em;height:1.35em;flex:none}
.btn.white{background:#fff}.btn.pink{background:#ff9cc8}.btn.mint{background:#7fe6cf}.btn.sky{background:#9fdcff}
.btn.small{min-height:44px;font-size:.95rem;padding:.45em .7em;border-radius:14px}
.btn.round{width:52px;padding:0;border-radius:50%}
.btn[disabled]{filter:grayscale(.8) opacity(.55);pointer-events:none}
.btn .zahl{background:var(--ink);color:#fff;border-radius:99px;font-size:.8em;padding:.12em .5em;min-width:1.6em}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.h-d{font-family:var(--fd);font-weight:700;line-height:1.08}

/* ---------- Hauptmenü ---------- */
.menu{grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(6px,1.6vh,16px);padding:clamp(10px,2.4vh,26px) clamp(12px,3vw,40px);justify-items:center;text-align:center}
.titel{font:700 clamp(1.9rem,6.2vmin,4.4rem)/1 var(--fd);color:#fff;text-shadow:var(--kontur);letter-spacing:.01em}
.titel b{color:#ff9cc8}.titel i{font-style:normal;color:#8fe38f}
.titel small{display:inline-block;font-size:.5em;color:var(--ink);background:var(--sun);text-shadow:none;border:3px solid var(--ink);border-radius:99px;padding:.15em .7em;margin:0 .3em;transform:rotate(-6deg) translateY(-.2em);box-shadow:0 4px 0 var(--ink)}
.unter{font:700 clamp(.95rem,2.4vmin,1.3rem)/1.2 var(--fd);color:#fff;opacity:.92;margin-top:.5em}
.unter b{color:var(--sun)}
.m-mitte{width:100%;max-width:1060px;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(10px,2vw,28px);align-items:center}
.held{position:relative;height:100%;min-height:0;display:grid;place-items:center}
.held-in{position:relative;width:min(100%,66vh);aspect-ratio:1.25}
.held .fig{position:absolute;bottom:4%;width:54%;aspect-ratio:1;z-index:1;animation:wippen 2.4s ease-in-out infinite alternate}
.held .fig.l{left:0}.held .fig.r{right:0;animation-delay:-1.2s}
.held .boden{position:absolute;left:2%;right:2%;bottom:0;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(10,4,30,.5),rgba(10,4,30,0) 68%)}
.held .fee{position:absolute;left:33%;top:-12%;width:34%;aspect-ratio:1.09;z-index:2;animation:schweben 2.2s ease-in-out infinite alternate}
@keyframes wippen{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5%) rotate(2deg)}}
@keyframes schweben{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-14%) rotate(4deg)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.8vmin,16px);width:100%}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.6em;text-align:left;font:700 clamp(1rem,2.5vmin,1.35rem)/1.1 var(--fd);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:20px;
  padding:clamp(8px,1.8vmin,18px);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;min-height:clamp(72px,15vh,128px)}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.tile .bild{width:clamp(44px,9.500vmin,84px);aspect-ratio:1;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;background:var(--sun)}
.tile .bild svg{width:68%;height:68%}
.tile small{display:block;font:400 .72em/1.2 var(--fb);opacity:.8;margin-top:.2em}
.tile.t1 .bild{background:#9fdcff}.tile.t2 .bild{background:#ff9cc8}.tile.t3 .bild{background:#8fe38f}.tile.t4 .bild{background:var(--sun)}
.tile.breit{grid-column:1/-1;background:var(--sun)}
.tile.breit .bild{background:#fff}
.m-fuss{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;width:100%}
.m-fuss .frei{flex:1}
.m-fuss a.btn{text-decoration:none}
@media (max-aspect-ratio:1/1){
  .m-mitte{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;align-items:center}
  .held-in{width:min(86%,40vh)}
}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.tile{min-height:64px}}

/* ---------- Bühne und 3D-Brett ---------- */
.stage{position:relative;min-width:0;min-height:0;--L:400px;--cy:200px;--in:16px;--sq:46px;--tilt:36deg;--pw:calc(var(--sq)*1.3);--gy:.88;touch-action:none;transition:transform .8s cubic-bezier(.2,.8,.3,1)}
.stage.flat{--pw:var(--sq);--gy:.5}
.stage.nah{transform:scale(1.2);z-index:5}
.stage.wackel{animation:wackel .32s linear}
@keyframes wackel{0%,100%{translate:0 0}20%{translate:-5px 4px}40%{translate:5px -3px}60%{translate:-3px -3px}80%{translate:3px 2px}}
.unterlicht{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 55%,var(--licht,rgba(180,156,240,.6)) 0,rgba(0,0,0,0) 66%);pointer-events:none;animation:licht 4s ease-in-out infinite alternate}
@keyframes licht{from{opacity:.6;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
.slab-shadow{position:absolute;border-radius:14%;background:rgba(8,3,26,.5);filter:blur(calc(var(--L)*.03));pointer-events:none}
.slab-front{position:absolute;background:linear-gradient(var(--rim-lo),var(--rim-dk));border:calc(var(--L)*.006) solid var(--ink);border-top:0;border-radius:0 0 calc(var(--L)*.024) calc(var(--L)*.024);pointer-events:none;overflow:hidden}

/* ---------- Spiel ---------- */
.game{grid-template-columns:minmax(0,1fr) clamp(236px,27vw,330px);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"stage top" "stage coach" "stage btns" "stage bot";gap:10px;padding:10px}
.game.gedreht{transform:rotate(180deg)}
.game .strip,.game .coach,.game .g-btns{transition:opacity .22s,background .25s,color .25s,border-color .25s,box-shadow .25s}
.game.wechsel .strip,.game.wechsel .coach,.game.wechsel .g-btns{opacity:0}
.verkehrt .ov,.verkehrt .konfetti{transform:rotate(180deg)}
.game .stage{grid-area:stage}
.a-top{grid-area:top}.a-bot{grid-area:bot}.a-coach{grid-area:coach}.a-btns{grid-area:btns}
.nurquiz .cam,.nurquiz .hud{visibility:hidden}
.strip{display:flex;align-items:center;gap:8px;min-height:54px;padding:5px 10px 5px 6px;border-radius:18px;background:rgba(255,255,255,.13);border:2.5px solid rgba(255,255,255,.2);color:#fff;transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
.strip.dran{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.strip .kopf{width:44px;height:44px;flex:none;border-radius:50%;background:rgba(255,255,255,.85);border:2.5px solid var(--ink);overflow:hidden;position:relative}
.strip .kopf svg{position:absolute;left:-28%;top:-6%;width:156%;height:156%}
.strip .wer{min-width:0;flex:1}
.strip .name{font:700 1rem/1.1 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .beute{display:flex;flex-wrap:wrap;align-items:center;min-height:22px;margin-top:1px}
.strip .beute svg{width:22px;height:22px;margin-right:-7px}
.strip .beute b{font:700 .85rem/1 var(--fd);margin-left:12px;background:var(--green);color:var(--ink);border-radius:99px;padding:.15em .5em;border:2px solid var(--ink)}
.strip .zug{font:700 .78rem/1 var(--fd);background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:.3em .6em;white-space:nowrap;display:none}
.strip.dran .zug{display:block;animation:hupf .5s ease-in-out infinite alternate}
@keyframes hupf{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.denkt{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.denkt i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:denkt .9s ease-in-out infinite}
.denkt i:nth-child(2){animation-delay:.15s}.denkt i:nth-child(3){animation-delay:.3s}
@keyframes denkt{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.coach{position:relative;min-height:0;display:flex;flex-direction:column;align-items:stretch}
.coach .bubble{position:relative;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.coach .rolle{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px}
.coach .bubble::after{content:"";position:absolute;left:50%;bottom:-17px;width:26px;height:26px;margin-left:-13px;background:var(--paper);border:3px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg) translate(-7px,-7px);border-radius:0 0 6px 0}
.coach .kopfzeile{display:flex;align-items:center;gap:8px;min-height:34px;position:relative;z-index:1}
.coach .rolle{position:relative;z-index:1}
.coach .kopfzeile b{font:700 .9rem/1 var(--fd);opacity:.7;flex:1}
.coach .sagen{font-size:clamp(1rem,2.1vmin,1.18rem);line-height:1.38}
.coach .sagen b{font-family:var(--fd)}
.coach .sagen.neu{animation:neu .3s ease-out}
@keyframes neu{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.coach .acts{display:flex;flex-wrap:wrap;gap:8px}

  const body = h('div', { class: 'liste' });

  body.appendChild(Ui.btn('Weiterspielen', 'los', '', () => sh.close()));
  body.appendChild(h('h3', { class: 'wer-hilft', text: 'Wie viel soll ' + Txt.name + ' helfen?' }));
  body.appendChild(Ui.choice([{ v: 'viel', html: 'Viel<small>Warnungen und Tipps</small>' }, { v: 'wenig', html: 'Wenig<small>nur das Wichtigste</small>' }, { v: 'ohne', html: 'Gar nicht<small>wie die Großen</small>' }], G.help, v => {
    G.help = v; G.hintsLeft = v === 'viel' ? -1 : v === 'wenig' ? (G.hintsLeft < 0 ? 5 : Math.min(G.hintsLeft, 5)) : 0;
    persist(); renderButtons();
  }, 'c2'));
  body.appendChild(h('h3', { text: 'Einstellungen' }));
  App.settings().forEach(t => body.appendChild(t));
  const z = h('div', { class: 'zeile' });
  z.appendChild(Ui.btn('Die Figuren', 'frage', 'sky', () => App.figures()));
  /* Mitten im Spiel umziehen: Die Schatzkiste führt danach wieder hierher zurück */
  z.appendChild(Ui.btn('Schatzkiste', 'geschenk', 'pink', () => { sh.close(); Gift.chest({ back: zurueckInsSpiel }); }));
  z.appendChild(Ui.btn('Neu anfangen', 'neu', 'white', () => { sh.close(); start({ mode: G.mode, level: G.level, human: G.human, seat: G.seat, help: G.help }); }));
  z.appendChild(Ui.btn('Hauptmenü', 'haus', 'white', () => { sh.close(); leave(); }));
  body.appendChild(z);
}
function leave() {
  tok++; stopEmotes(); closeEnd();
  document.getElementById('app').classList.remove('verkehrt');
  if (G) persist();
  Sys.hush();
  App.menu();
}
/* Aus der Schatzkiste zurück ins Spiel: Brett zeigen und neu anziehen */
function zurueckInsSpiel() { Ui.show('scr-game'); refresh(); }
/* Aussehen hat sich geändert (Einstellungen): Brett neu anziehen */
function refresh() { if (bv) { Look.apply(); rebuild(); Look.dress(bv); if (G) renderStrips(); } }

/* ---------- Kleine Sprüche der Figuren ---------- */
const EMO_OWN = ['Ich! Ich!', 'Nimm mich!', 'Hier!', 'Los!', 'Juhu!'], EMO_FOE = ['Hihi!', 'Gähn …', 'La la la', 'Huhu!', 'Na los!', 'Hmm …'];
function startEmotes() {
  stopEmotes();
  emoteTimer = setInterval(() => {
    if (!G || G.over || busy || G.pending || !humanTurn() || G.sel >= 0 || document.hidden || !els.root.classList.contains('on') || document.querySelector('.ov')) return;
    const keys = Object.keys(bv.pcs);
    if (!keys.length) return;
    const sq = +Sys.pick(keys), own = (G.pos.b[sq] >> 3) === G.pos.side;
    bv.bubble(sq, Sys.pick(own ? EMO_OWN : EMO_FOE));
  }, 9000);
}
function stopEmotes() { clearInterval(emoteTimer); }

return { start: start, refresh: refresh, get active() { return !!G; }, _dbg() { return { G: G, bv: bv }; } };
})();

/* =========================================================
   Start, Hauptmenü, Spiel einrichten, Einstellungen, Hilfe.
   ========================================================= */
var App = (function () {
'use strict';
const h = Sys.h, D = Data;
const KINDS = [1, 2, 3, 4, 5, 6];
let held = null;   /* die kleine 3D-Bühne im Hauptmenü */

function boot() {
  Sys.load();
  document.getElementById('defs').innerHTML = Art.defs();
  /* Zackenstern für die Comic-Wörter */
  const pts = [];
  for (let i = 0; i < 28; i++) { const a = i * Math.PI / 14, r = i % 2 ? 36 : 50; pts.push((50 + Math.cos(a) * r).toFixed(1) + '% ' + (50 + Math.sin(a) * r).toFixed(1) + '%'); }
  document.documentElement.style.setProperty('--zack', 'polygon(' + pts.join(',') + ')');
  Look.apply();
  sky();
  menu();
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, Sys.unlock, { capture: true, passive: true }));
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) Sys.hush(); });
  /* Elos Stimme schon holen, während das Kind noch im Menü ist – dann spricht er beim ersten Zug sofort */
  if (Sys.S.set.voice) setTimeout(() => Sys.loadVoice(), 700);
}
function sky() {
  const box = document.getElementById('sky');
  let s = '';
  for (let i = 0; i < 28; i++) s += '<i style="--x:' + Sys.rnd(100) + '%;--y:' + Sys.rnd(100) + '%;--s:' + (3 + Sys.rnd(6)) + 'px;--t:' + (3 + Math.random() * 5).toFixed(1) + 's;--d:' + (-Math.random() * 8).toFixed(1) + 's;--o:' + (0.35 + Math.random() * 0.5).toFixed(2) + ';--dx:' + (Sys.rnd(30) - 15) + 'px;--dy:' + (-8 - Sys.rnd(26)) + 'px;--c:' + Sys.pick(['#ffffff', '#fff3a8', '#ffd0ea', '#bfeaff']) + '"></i>';
  box.innerHTML = s;
}
const onSite = () => /^https?:$/.test(location.protocol) && /\/schach\/(index\.html)?$/.test(location.pathname);

/* ---------- Hauptmenü ---------- */
function menu() {
  const scr = document.getElementById('scr-menu'), S = Sys.S;
  if (held) { held.destroy(); held = null; }
  scr.textContent = '';
  Look.apply();
  scr.appendChild(h('header', null,
    h('h1', { class: 'titel', html: '<b>Einhörner</b> <small>gegen</small> <i>Dinos</i>' }),
    h('p', { class: 'unter', html: 'Das Schachspiel von <b>Nele</b> und <b>Lotte</b>' })));
  const tiles = h('div', { class: 'tiles' });
  const tile = (cls, icon, label, sub, fn) => {
    const b = h('button', { class: 'tile ' + cls, type: 'button', html: '<span class="bild">' + Art.ICON[icon] + '</span><span>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span>' });
    b.addEventListener('click', () => { Sys.unlock(); Sys.play('tap'); fn(); });
    tiles.appendChild(b);
  };
  if (S.save && S.save.moves && S.save.moves.length) tile('breit', 'los', 'Weiterspielen', S.save.mode === 'duo' ? 'Euer Spiel zu zweit wartet noch' : 'Dein Spiel gegen den Computer wartet noch', () => Game.start(S.save));
  tile('t1', 'computer', 'Gegen den Computer', 'Gewinne Geschenke!', setupBot);
  tile('t2', 'zwei', 'Zu zweit', 'Einhörner gegen Dinos', setupDuo);
  tile('t3' + (Object.keys(S.school).length ? '' : ' start'), 'schule', 'Schach-Schule', 'Lerne alle Figuren kennen', () => School.list());
  /* Schatzkiste: Hier zieht man um. Ein Schildchen zeigt neue Geschenke – oder dass man hier wechseln kann. */
  const neu = S.neu.length, wink = neu ? (neu === 1 ? '1 neues Geschenk!' : neu + ' neue Geschenke!') : (S.gifts.length && !S.know.schrank ? 'Hier umziehen!' : '');
  tile('t4' + (wink ? ' wink' : ''), 'geschenk', 'Schatzkiste', 'Umziehen und sammeln · ' + S.gifts.length + ' von ' + D.GIFTS.length, () => Gift.chest());
  if (wink) tiles.lastChild.dataset.wink = wink;
  /* In der Mitte stehen die beiden Könige – in 3D lebendig auf einem Podest, sonst als Bild */
  const drei = Brett.drei(), buehne = drei ? h('div', { class: 'held-3d' }) : null;
  const heldIn = h('div', { class: 'held-in' + (drei ? ' lebt' : ''), html: drei ? '' : '<div class="boden"></div><div class="fig l">' + Ui.fig('u', 'k', null, 512) + '</div><div class="fig r">' + Ui.fig('d', 'k', null, 512) + '</div>' });
  if (buehne) heldIn.appendChild(buehne);
  heldIn.appendChild(h('div', { class: 'fee', html: Art.svg(Art.ELEFANT, '0 0 120 110') }));
  scr.appendChild(h('div', { class: 'm-mitte' }, h('div', { class: 'held' }, heldIn), tiles));
  const fuss = h('footer', { class: 'm-fuss' });
  if (onSite()) fuss.appendChild(h('a', { class: 'btn white small', href: '../index.html', html: Art.ICON.pfeil + '<span>Alle Spiele</span>' }));
  fuss.appendChild(h('span', { class: 'frei' }));
  fuss.appendChild(Ui.btn('Die Figuren', 'frage', 'sky small', figures));
  fuss.appendChild(Ui.btn('Einstellungen', 'rad', 'white small', () => { Ui.sheet('Einstellungen', h('div', { class: 'liste' }, settings())); }));
  scr.appendChild(fuss);
  Ui.show('scr-menu');
  if (buehne) { held = Drei.schau(buehne, { art: 'held', onTap() { Sys.play('pick'); } }); if (!held) { heldIn.classList.remove('lebt'); buehne.remove(); heldIn.insertAdjacentHTML('afterbegin', '<div class="boden"></div><div class="fig l">' + Ui.fig('u', 'k', null, 512) + '</div><div class="fig r">' + Ui.fig('d', 'k', null, 512) + '</div>'); } }
}

/* ---------- Spiel einrichten ---------- */
/* Vor dem Spiel noch schnell umziehen: Die Schatzkiste führt danach wieder zu diesem Fenster zurück.
   Den Knopf gibt es erst, wenn etwas zum Anziehen gewonnen wurde. */
function umziehen(fenster, wieder) {
  if (!Sys.S.gifts.some(id => 'budh'.indexOf(id[0]) >= 0)) return null;
  return Ui.btn('Umziehen', 'buegel', 'white', () => { fenster().close(); Gift.chest({ back() { menu(); wieder(); } }); });
}
function setupBot() {
  const S = Sys.S;
  let level = S.last.level || 1, human = S.last.human ? 1 : 0;
  const lv = [1, 2, 3, 4].map(n => ({ v: n, html: Ui.stars(n, 4) + D.LEVELS[n].n + '<small>' + D.LEVELS[n].sub + '</small>' + Ui.gifts(D.LEVELS[n].gifts) }));
  const who = [{ v: 0, html: '<span class="bild">' + Ui.fig('u', 'n') + '</span>Einhörner<small>fangen an</small>' }, { v: 1, html: '<span class="bild">' + Ui.fig('d', 'n') + '</span>Dinos' }];
  const neu = !Object.keys(S.school).length;
  const sh = Ui.sheet('Gegen den Computer', [
    neu ? h('div', { class: 'hinweis' }, h('span', { text: 'Neu beim Schach? In der Schach-Schule zeigt ' + Txt.name + ' dir zuerst alle Figuren.' }), Ui.btn('Zur Schach-Schule', 'schule', 'mint small', () => { sh.close(); School.list(); })) : null,
    h('h3', { text: 'Wie schwer soll es sein?' }), Ui.choice(lv, level, v => { level = v; }, 'c2'),
    h('h3', { text: 'Wer möchtest du sein?' }), Ui.choice(who, human, v => { human = v; }, 'c2'),
    h('div', { class: 'zeile' }, Ui.btn('Los!', 'los', '', () => { S.last.level = level; S.last.human = human; Sys.save(); sh.close(); Game.start({ mode: 'bot', level: level, human: human, help: D.LEVELS[level].help }); }), umziehen(() => sh, setupBot))
  ], { onClose() { Sys.hush(); } });
  Sys.speak(neu ? Txt.setupNeu : Txt.setupBot);
}
function setupDuo() {
  const S = Sys.S;
  let seat = S.last.seat === 'gegen' ? 'gegen' : 'neben', help = S.last.help !== false;
  const sh = Ui.sheet('Zu zweit', [
    h('h3', { text: 'Wie sitzt ihr?' }), Ui.choice([{ v: 'neben', html: 'Nebeneinander<small>Das Brett bleibt stehen</small>' }, { v: 'gegen', html: 'Gegenüber<small>Das Brett dreht sich zu dem, der dran ist</small>' }], seat, v => { seat = v; }, 'c2'),
    h('h3', { text: 'Soll ' + Txt.name + ' helfen?' }), Ui.choice([{ v: true, html: 'Ja, bitte!<small>Warnungen und Tipps</small>' }, { v: false, html: 'Nein<small>Wir können das allein</small>' }], help, v => { help = v; }, 'c2'),
    h('p', { html: 'Wer gewinnt, bekommt ein Geschenk für die Schatzkiste. ' + Ui.gifts(1) }),
    h('div', { class: 'zeile' }, Ui.btn('Los!', 'los', '', () => { S.last.seat = seat; S.last.help = help; Sys.save(); sh.close(); Game.start({ mode: 'duo', seat: seat, help: help ? 'viel' : 'ohne' }); }), umziehen(() => sh, setupDuo))
  ], { onClose() { Sys.hush(); } });
  Sys.speak(Txt.setupDuo);
}

/* ---------- Einstellungen (auch im Pause-Fenster) ---------- */
function settings() {
  const S = Sys.S, out = [];
  if (Sys.canSpeak) out.push(Ui.toggle('Vorlesen', 'vorlesen', () => S.set.voice, v => { S.set.voice = v; Sys.save(); if (v) Sys.speak(Txt.voiceOn); else Sys.hush(); }));
  /* Wer liest vor? Elo (Männerstimme) oder Ela (Frauenstimme) */
  if (Sys.hatFrau) {
    out.push(h('h3', { text: 'Wer liest vor?' }));
    out.push(Ui.choice([{ v: 'm', html: 'Elo<small>der Schach-Elefant</small>' }, { v: 'f', html: 'Ela<small>die Schach-Elefantin</small>' }], Sys.stimme, v => {
      Sys.setStimme(v);
      document.querySelectorAll('.coach .wer').forEach(e => { e.textContent = Txt.name + ' sagt:'; });
      document.querySelectorAll('.wer-hilft').forEach(e => { e.textContent = 'Wie viel soll ' + Txt.name + ' helfen?'; });
      if (!S.set.voice) { S.set.voice = true; Sys.save(); document.querySelectorAll('.schalter.vorlesen').forEach(b => b.setAttribute('aria-pressed', 'true')); }
      Sys.speak(Txt.hello);
    }, 'c2'));
  }
  out.push(Ui.toggle('Töne', 'ton', () => S.set.sound, v => { S.set.sound = v; Sys.save(); }));
  out.push(Ui.toggle('Brett in 3D', 'auge', () => !S.set.flat, v => { S.set.flat = !v; Sys.save(); Game.refresh(); }));
  if (!Brett.drei()) out.push(Ui.toggle('Echte Schach-Zeichen an den Figuren', 'frage', () => S.set.symbols, v => { S.set.symbols = v; Sys.save(); Game.refresh(); }));
  return out;
}

/* ---------- Die Figuren ---------- */
function figures() {
  const box = h('div', { class: 'figuren' });
  [6, 5, 4, 3, 2, 1].forEach(t => {
    const p = D.PIECE[t], text = Txt.figure(t);
    const row = h('div', { class: 'figur' },
      h('div', { class: 'paar', html: '<span>' + Ui.fig('u', p.k, '', 192) + '</span><span>' + Ui.fig('d', p.k, '', 192) + '</span>' }),
      h('div', null, h('b', { html: p.n + ' <span class="echt" title="So sieht die Figur im echten Schach aus">' + Art.CLASSIC[p.k] + '</span>' + (p.pts ? '<em>' + p.pts + (p.pts === 1 ? ' Punkt' : ' Punkte') + '</em>' : '') }), h('p', { text: p.how })),
      Ui.btn('', 'ton', 'white round small', () => Sys.speak(text), p.n + ' vorlesen'));
    box.appendChild(row);
  });
  Ui.sheet('Die Figuren', [h('p', { text: 'Links die Einhörner, rechts die Dinos. Das kleine Zeichen zeigt, wie die Figur im echten Schach aussieht.' }), box], { wide: true, onClose() { Sys.hush(); } });
}

return { boot: boot, menu: menu, settings: settings, figures: figures };
})();
App.boot();

</script>
